name: Orby AI
description: >-
  Orby AI is an enterprise generative process automation company that uses Large Action Models,
  neuro-symbolic reasoning, and agentic process discovery to observe how people work and then
  automate repetitive back-office and desktop workflows across applications. Founded by former
  DeepMind and Google researchers, Orby was backed by Wing Venture Capital and NEA before being
  acquired by Uniphore in August 2025, where its technology now powers the Uniphore Business AI
  Cloud. Orby publishes no public developer API, SDK, or documentation surface; its capabilities are
  delivered as an enterprise platform accessed via demo and sales engagement.
